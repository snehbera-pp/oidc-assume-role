name: oidc-demo
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request the GitHub token
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

            - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | python3 -c "import sys,json,base64; p=sys.stdin.read().strip().split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ['iss','aud','sub','ref','repository']}, indent=2))"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::501046919017:role/github-oidc-demo-role
          role-session-name: gha-oidc-demo
          aws-region: us-east-1

      - name: Who am I?
        run: aws sts get-caller-identity

      - name: Upload a file to S3
        run: |
          echo "Hello from GitHub Actions at $(date)" > hello.txt
          aws s3 cp hello.txt s3://oidc-demo-sb-learning/hello.txt
          aws s3 ls s3://oidc-demo-sb-learning/ 