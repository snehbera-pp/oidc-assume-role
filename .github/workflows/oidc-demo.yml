name: oidc-demo
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: oidc-demo-sneh-bera
          aws-region: us-east-1

      - name: Who am I?
        run: aws sts get-caller-identity

      - name: Upload a file to S3
        run: |
          echo "Hello from Terraform-built role at $(date)" > hello.txt
          aws s3 cp hello.txt s3://${{ vars.AWS_BUCKET }}/hello.txt
          aws s3 ls s3://${{ vars.AWS_BUCKET }}/